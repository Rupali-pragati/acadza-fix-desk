<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix Desk · Acadza report review</title>
  <meta name="description" content="Faculty console for student error reports: what changed, why, and one-click approve / edit / reject.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233451d1'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <script>
    let t = 'light'; try { t = localStorage.getItem('fixdesk.theme') || 'light'; } catch {} document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span>Fix Desk <small>· student error reports</small></div>
      <div class="progress" id="progress"></div>
      <div class="spacer"></div>
      <input class="search" id="search" type="search" placeholder="Search  /" aria-label="Search cases">
      <div class="reviewer" id="reviewer"></div>
      <button class="icon-btn" id="audit-btn" title="Audit log">Audit log</button>
      <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </header>
    <div class="main" id="main">
      <nav class="queue" aria-label="Review queue">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="queue-hint" id="queue-hint"></div>
        <div class="list" id="list"></div>
      </nav>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>
  </div>
  <div id="overlay"></div>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
