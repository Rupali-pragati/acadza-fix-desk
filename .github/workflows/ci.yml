name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install httpx pytest
      - run: python -m pytest -q
      - run: python -m engine run --replay   # rebuilds results.json from the committed LLM cache, no key needed
      - run: git diff --exit-code results.json   # results.json must be exactly reproducible
