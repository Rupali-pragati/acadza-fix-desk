name: Deploy console to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install httpx pytest
      - run: python -m pytest -q
      - run: python -m engine run --replay   # rebuilds results.json from the committed LLM cache, no key needed
      - run: git diff --exit-code results.json
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
